name: Feature Request / 功能建议
description: Propose an improvement to the AI tutor memory engine, FSRS/spaced repetition models, scheduler, or integrations.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case / 背景与痛点
      description: What learning or developer workflow problem does this solve?
      placeholder: "e.g. When using an AI tutor for spaced repetition..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / 建议方案
      description: Describe how you envision this working within the Core / Vault separation.
      placeholder: Outline the CLI command, schema field, or workflow behavior...
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility & Notes / 兼容性与补充说明
      description: Does this affect existing Schema 1.0 ledgers or remain backwards-compatible?
      placeholder: "Optional notes..."
    validations:
      required: false
